<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Задачи — Спланировать цель</title>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<link href="../_planner/chrome.css" rel="stylesheet"/>
</head>
<body>
<header class="topbar">
  <div>
    <h1 class="serif">Задачи</h1>
    <span class="eyebrow">Горологический меридиан · 24ч</span>
  </div>
  <div class="avatar" aria-hidden="true"><span class="material-symbols-outlined" style="font-size:18px">person</span></div>
</header>
<main>
  <div class="date-row">
    <h2 class="serif">Ср, 4 ноя <span class="today-pill">Сегодня</span></h2>
  </div>
  <button class="plan-entry" type="button">
    <span class="material-symbols-outlined" style="color:var(--primary)">flag</span>
    <span>
      <strong>Спланировать цель</strong>
      <span>Черновик на сервере. На циферблат — только после согласия.</span>
    </span>
    <span class="material-symbols-outlined" style="margin-left:auto;color:var(--secondary)">chevron_right</span>
  </button>
  <article class="card" style="--accent:#2563EB">
    <div class="meta">
      <span class="chip">К выполнению</span>
      <span class="chip">Встреча</span>
    </div>
    <h3>Встреча с командой</h3>
    <p class="when">10:00 – 12:00 · закрытый отрезок не сдвигается</p>
  </article>
  <article class="card" style="--accent:#2E7D52">
    <div class="meta"><span class="chip">Без часов</span><span class="chip">Средняя</span></div>
    <h3>Разобрать почту</h3>
    <p class="when">Заполнит остаток половины дня, вес 3</p>
  </article>
</main>
<button class="fab" type="button"><span class="material-symbols-outlined">add</span>Задача</button>
<nav class="nav">
  <a href="#"><span class="material-symbols-outlined">schedule</span>День</a>
  <a class="active" href="#"><span class="material-symbols-outlined">checklist</span>Задачи</a>
  <a href="#"><span class="material-symbols-outlined">analytics</span>Отчёты</a>
  <a href="#"><span class="material-symbols-outlined">settings</span>Настройки</a>
</nav>
</body>
</html>
