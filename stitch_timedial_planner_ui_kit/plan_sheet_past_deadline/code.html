<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Срок уже прошёл</title>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<link href="../_planner/chrome.css" rel="stylesheet"/>
</head>
<body>
<header class="topbar"><div><h1 class="serif">Задачи</h1><span class="eyebrow">Форма остаётся</span></div></header>
<main></main>
<div class="scrim"></div>
<section class="sheet" aria-label="Срок в прошлом">
  <div class="handle"></div>
  <h2 class="serif">Спланировать цель</h2>
  <div class="error-banner" role="alert">День уже прошёл. Выберите сегодня или более поздний день. Циферблат не меняется.</div>
  <label class="field">
    <span class="k">Цель</span>
    <input value="Подготовить отчёт"/>
  </label>
  <label class="field">
    <span class="k">Срок</span>
    <input value="Вчера, 3 ноября" aria-invalid="true"/>
  </label>
  <div class="window"><b>09:00 – 19:00</b></div>
  <p class="hint">Пустая цель и окно нулевой длины тоже оставляют вас на этой форме и объясняют, что исправить.</p>
  <button class="primary" type="button">Спланировать</button>
</section>
<nav class="nav">
  <a href="#"><span class="material-symbols-outlined">schedule</span>День</a>
  <a class="active" href="#"><span class="material-symbols-outlined">checklist</span>Задачи</a>
  <a href="#"><span class="material-symbols-outlined">analytics</span>Отчёты</a>
  <a href="#"><span class="material-symbols-outlined">settings</span>Настройки</a>
</nav>
</body>
</html>
