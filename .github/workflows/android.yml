# Debug unit tests and a debug APK on every push and pull request.
# No secrets, keystore, or google-services.json.

name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source GitHub Actions cache. No cache encryption secret.
          cache-provider: basic

      - name: Accept Android SDK licenses
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is unset on this runner" >&2
            exit 1
          fi
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager" --licenses

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: bash ./gradlew :app:assembleDebug --stacktrace
